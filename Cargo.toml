[package]
name = "servicelib-gorundebug"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Rust port of gorundebug servicelib"
repository = "https://github.com/gorundebug/rustservicelib"

[lib]
name = "servicelib"

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
http-body = "1"
notify = "8"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
